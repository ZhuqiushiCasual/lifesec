<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小小菜单 · 今晚吃什么</title>
<!--
  /date —— 挑餐厅（selfsec 的一个页面，跟着 static/ 一起托管）

  页面职责：
    1. 前台：瀑布流菜单（GET /api/date/menu，不需要 token）→ 点卡片浮层看图文
       （多张实拍图左右翻）→ 浮层里「就这家」→ 确认弹层里那句话可以改
       → POST /api/date/choose，落一条 messages(role=me)。
       文案刻意克制：不出现"发给谁""他"这类指向，就是"确认一下"。
    2. 后台：右上角半透明小齿轮 → 输入密码
       （DATE_ADMIN_PASSWORD，请求头 X-Date-Password）→ 增删改 + 上下移排序 + 删图。

  零依赖零构建，跟着 selfsec 的 static/ 一起被 StaticFiles 托管。
  实拍图存在 backend/static/date_photos/<slug>/NN.jpg（gitignore，跟 media/ 一个待遇），
  数据库里一行一张（date_photos），没有图时回落到内联 SVG 占位插画。
-->
<style>
  :root{
    --paper:#FBF7F1; --card:#FFFFFF;
    --ink:#3A3129; --ink2:#6E6055; --ink3:#A79684;
    --line:#F0E6DA; --line2:#F8F2E9;
    --warm:#E8845A; --warm-d:#C96A42; --amber:#F2B872;
    --green:#5F8F5F; --red:#C25B4B;
    --shadow:0 1px 2px rgba(120,90,60,.05), 0 10px 26px rgba(120,90,60,.07);
    --shadow-s:0 1px 2px rgba(120,90,60,.05), 0 4px 12px rgba(120,90,60,.05);
    --shadow-l:0 18px 50px rgba(90,70,50,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;padding:0;color:var(--ink);font-size:15px;line-height:1.68;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(560px 320px at 90% -8%, #FFF3E4 0%, rgba(255,243,228,0) 62%),
      radial-gradient(520px 300px at 2% 4%, #FDF6EC 0%, rgba(253,246,236,0) 58%),
      var(--paper);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}
  @media(min-width:1080px){ .wrap{max-width:1080px} }

  /* ── 顶栏 ── */
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 4px}
  .brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--ink2)}
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg,var(--warm),var(--amber));
    box-shadow:0 0 0 4px rgba(232,132,90,.12);
  }
  .gear{
    border:0;background:transparent;color:var(--ink3);opacity:.28;font-size:16px;
    padding:8px;cursor:pointer;line-height:1;
  }
  .gear:active{opacity:.6}

  /* ── 抬头 ── */
  .hero{padding:6px 2px 12px}
  .hero h1{
    margin:0 0 6px;font-size:26px;line-height:1.28;letter-spacing:-.5px;font-weight:800;
  }
  .hero h1 em{font-style:normal;color:var(--warm-d)}
  .hero .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hero p{margin:0;font-size:13px;color:var(--ink2)}
  .hero .note{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;color:var(--ink3);background:#fff;border:1px dashed var(--line);
    border-radius:999px;padding:4px 10px;
  }

  /* ── 筛选 ── */
  .filters{
    position:sticky;top:0;z-index:6;display:flex;gap:7px;overflow-x:auto;
    margin:0 -14px;padding:8px 14px 10px;scrollbar-width:none;
    background:linear-gradient(180deg,rgba(255,249,245,.97),rgba(255,249,245,.82));
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;
    cursor:pointer;box-shadow:var(--shadow-s);transition:.16s ease;white-space:nowrap;
  }
  .chip:active{transform:scale(.96)}
  .chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--warm),var(--warm-d))}

  /* ── 瀑布流（错版两列：grid-auto-rows 精确定高，JS 量完再定跨行数）── */
  .mosaic{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    grid-auto-rows:4px;gap:0 10px;padding:10px 0 0;
  }
  @media(min-width:760px){ .mosaic{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media(min-width:1080px){ .mosaic{grid-template-columns:repeat(4,minmax(0,1fr))} }

  .card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow-s);overflow:hidden;cursor:pointer;margin:0 0 10px;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation:rise .32s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card:active{transform:scale(.985)}
  .card.sel{border-color:var(--warm);box-shadow:0 0 0 2px rgba(232,132,90,.28),var(--shadow)}

  .cover{position:relative;background:#F3EBE2;overflow:hidden}
  .cover img{width:100%;height:auto;display:block;object-fit:cover}
  .cover svg{width:100%;height:auto;display:block}
  .shade{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 52%,rgba(0,0,0,.44) 100%);
  }
  .badge{
    position:absolute;font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 8px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);letter-spacing:.01em;
  }
  .badge.dist{left:8px;bottom:8px;color:#fff;background:rgba(58,49,41,.5)}
  .badge.taste{left:8px;top:8px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9)}
  .badge.taste.light{color:#4E8A5C}
  .badge.taste.spicy{color:#C2544A}
  .badge.taste.oil{color:#A67517}
  .badge.count{
    right:8px;bottom:8px;color:#fff;background:rgba(58,49,41,.42);
    display:inline-flex;align-items:center;gap:3px;
  }
  .badge.count svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.9}
  .tick{
    position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;
    display:grid;place-items:center;font-size:12px;color:#fff;
    background:linear-gradient(135deg,var(--warm),var(--warm-d));
    opacity:0;transform:scale(.7);transition:.16s ease;
  }
  .card.sel .tick{opacity:1;transform:none}

  .cbody{padding:9px 11px 11px}
  .cname{
    margin:0;font-size:14px;font-weight:800;line-height:1.4;letter-spacing:-.1px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cmeta{
    margin:3px 0 0;font-size:11px;color:var(--ink3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .crow{display:flex;align-items:baseline;gap:6px;margin-top:6px}
  .crow .p{font-size:13.5px;font-weight:800;color:var(--warm-d)}
  .crow .p small{font-size:9.5px;font-weight:600;color:var(--ink3);margin-left:1px}
  .crow .s{font-size:11px;color:var(--ink3);font-weight:600}

  /* ── 浮层：图集 + 详情 ── */
  .modal{
    position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(38,30,24,.44);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .modal.show{opacity:1;pointer-events:auto}
  .panel{
    width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;
    max-height:92vh;display:flex;flex-direction:column;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    transform:translateY(16px);transition:transform .24s cubic-bezier(.2,.8,.3,1);
    box-shadow:var(--shadow-l);
  }
  .modal.show .panel{transform:none}
  @media(min-width:820px){
    .modal{align-items:center;padding:24px}
    .panel{
      max-width:none;width:min(940px,96vw);max-height:88vh;border-radius:20px;
      display:grid;grid-template-columns:1.1fr .9fr;grid-template-rows:1fr;
    }
  }
  .gal{
    position:relative;background:#F3EBE2;flex:0 0 auto;
    display:flex;flex-direction:column;min-width:0;
  }
  @media(min-width:820px){ .gal{height:100%;min-height:0} }
  .gal-main{
    position:relative;overflow:hidden;flex:0 0 auto;min-height:0;
    aspect-ratio:4/5;max-height:46vh;touch-action:pan-y;background:#F3EBE2;
  }
  @media(min-width:820px){ .gal-main{aspect-ratio:auto;height:auto;flex:1 1 auto;max-height:none} }
  .gal-main img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .18s ease}
  .gal-main img.fade{opacity:.25}
  .gal-main .ph{width:100%;height:100%}
  .gal-main .ph svg{width:100%;height:100%}
  .gal-main::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:76px;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.42));
  }
  .gbtn{
    position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
    border:0;background:rgba(255,255,255,.86);color:var(--ink2);cursor:pointer;
    display:grid;place-items:center;font-size:17px;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.14);
  }
  .gbtn[disabled]{opacity:0;pointer-events:none}
  .gbtn.prev{left:10px} .gbtn.next{right:10px}
  .gcount{
    position:absolute;right:10px;top:10px;font-size:11.5px;font-weight:700;color:#fff;
    background:rgba(38,30,24,.46);border-radius:999px;padding:3px 9px;letter-spacing:.02em;
  }
  .gnote{
    position:absolute;left:10px;right:10px;bottom:8px;z-index:2;font-size:10.5px;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:.95;pointer-events:none;
  }
  .thumbs{
    display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);
    border-bottom:1px solid var(--line2);scrollbar-width:none;flex:0 0 auto;
  }
  .thumbs::-webkit-scrollbar{display:none}
  .thumbs button{
    flex:0 0 auto;width:42px;height:42px;border-radius:9px;overflow:hidden;padding:0;
    border:2px solid transparent;background:#F3EBE2;cursor:pointer;opacity:.72;transition:.14s ease;
  }
  .thumbs button.on{border-color:var(--warm);opacity:1}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .close-x{
    position:absolute;right:10px;top:10px;z-index:3;width:30px;height:30px;border-radius:50%;
    border:0;background:rgba(255,255,255,.9);color:var(--ink2);cursor:pointer;
    display:grid;place-items:center;font-size:15px;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  .modal .gcount{right:48px}
  @media(min-width:820px){ .close-x{right:10px} .modal .gcount{right:48px} }

  .det{flex:0 0 auto;padding:16px 16px 6px}
  .det h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.35}
  .det .sub{margin:0 0 12px;font-size:12.5px;color:var(--ink2)}
  .det .sub .sep{margin:0 6px;color:var(--ink3)}
  .facts{display:flex;gap:7px;margin:0 0 12px}
  .fact{flex:1;background:var(--line2);border-radius:11px;padding:7px 4px;text-align:center}
  .fact b{display:block;font-size:14px;font-weight:800;line-height:1.35}
  .fact span{display:block;font-size:10px;color:var(--ink3);margin-top:1px}
  .taste{display:flex;flex-direction:column;gap:5px;margin:0 0 13px}
  .trow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2)}
  .trow i{width:20px;flex:0 0 20px;font-style:normal;font-weight:700;color:var(--ink3)}
  .tbar{flex:1;height:5px;border-radius:99px;background:#F8EDE8;overflow:hidden}
  .tbar b{display:block;height:100%;border-radius:99px}
  .tbar b.l{background:linear-gradient(90deg,#B6DCAF,#6FA878)}
  .tbar b.s{background:linear-gradient(90deg,#F0B2A2,#C2544A)}
  .tbar b.o{background:linear-gradient(90deg,#F6D79E,#C78F2C)}
  .trow em{width:24px;flex:0 0 24px;text-align:right;font-style:normal;color:var(--ink3);font-variant-numeric:tabular-nums}

  .why{margin:0 0 11px;font-size:13.5px;color:var(--ink2);line-height:1.62}
  .why b,.go b,.tip b{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--ink3);font-weight:700;margin-bottom:3px}
  .why p{margin:0}
  .go{background:#FDFAF5;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;margin:0 0 10px}
  .go div{font-size:12.5px;color:var(--ink2);line-height:1.6}
  .go div+div{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
  .tip{font-size:12.5px;color:#8A6A3E;background:#FDF7EA;border:1px solid #F2E5C8;border-radius:11px;padding:9px 12px;line-height:1.6}

  .pfoot{
    position:sticky;bottom:0;z-index:4;
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:11px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:linear-gradient(180deg,#fff,rgba(255,251,247,.98));
  }
  .foot-x{
    display:none;flex:0 0 auto;width:34px;height:34px;border-radius:50%;padding:0;
    border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:14px;line-height:1;
    cursor:pointer;place-items:center;
  }
  @media(max-width:819px){ .foot-x{display:grid} }
  @media(min-width:820px){
    .pfoot{grid-column:2;grid-row:2;position:static}
    .gal{grid-column:1;grid-row:1/span 2}
    .det{grid-column:2;grid-row:1;overflow-y:auto;min-height:0}
  }
  .pfoot .who{flex:1;min-width:0;font-size:12px;color:var(--ink3);line-height:1.45}
  .pfoot .who b{display:block;font-size:13.5px;color:var(--ink);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .go-btn{
    flex:0 0 auto;font:inherit;font-size:14.5px;font-weight:800;color:#fff;border:0;cursor:pointer;
    border-radius:13px;padding:11px 20px;
    background:linear-gradient(135deg,var(--warm),var(--warm-d));
    box-shadow:0 6px 18px rgba(201,106,66,.26);transition:.16s ease;
  }
  .go-btn:active{transform:scale(.97)}

  /* ── 底部纸条 ── */
  .foot{margin:18px 2px 0;font-size:11px;color:var(--ink3);line-height:1.7}

  /* ── 弹层通用（确认 / 密码）── */
  .sheet-mask{
    position:fixed;inset:0;z-index:50;background:rgba(58,49,41,.34);
    backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(12px);transition:transform .22s cubic-bezier(.2,.8,.3,1);
    box-shadow:0 -10px 36px rgba(90,70,50,.14);
  }
  .sheet-mask.show .sheet{transform:none}
  @media(min-width:620px){
    .sheet-mask{align-items:center}
    .sheet{border-radius:18px;margin:0 16px;max-width:520px}
  }
  .sheet h3{margin:0 0 6px;font-size:16.5px;font-weight:800;letter-spacing:-.2px}
  .sheet .hint{margin:0 0 12px;font-size:12.5px;color:var(--ink2);line-height:1.6}
  .sheet textarea{
    width:100%;min-height:86px;resize:vertical;font:inherit;font-size:14.5px;color:var(--ink);
    background:#FDFBF7;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
    line-height:1.6;outline:none;
  }
  .sheet textarea:focus{border-color:var(--warm)}
  .sheet .rows{display:flex;gap:10px;margin-top:14px}
  .btn{
    flex:1;font:inherit;font-size:14.5px;font-weight:700;border-radius:12px;padding:12px 10px;
    cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink2);transition:.16s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--warm),var(--warm-d))}
  .btn.ghost{background:#FDFBF7}
  .btn.danger{color:#C2544A;border-color:#F6D8D2}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}

  /* ── 成功页 ── */
  .done{
    position:fixed;inset:0;z-index:60;background:var(--paper);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 22px calc(28px + env(safe-area-inset-bottom));text-align:center;
  }
  .done.show{display:flex}
  .done .mark{
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin-bottom:16px;
    background:linear-gradient(135deg,#FBEFE4,#F7E2CF);border:1px solid #F2DEC8;
    animation:pop .3s ease both;
  }
  .done .mark svg{width:24px;height:24px;stroke:var(--warm-d);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
  .done h2{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.3px}
  .done p{margin:0 0 18px;font-size:13px;color:var(--ink2);line-height:1.7}
  .done .bubble{
    max-width:330px;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 15px;font-size:14px;box-shadow:var(--shadow-s);color:var(--ink);
    text-align:left;word-break:break-word;
  }
  .done .bubble .who{font-size:10.5px;color:var(--ink3);letter-spacing:.1em;font-weight:700;margin-bottom:4px}
  .done .acts{display:flex;gap:10px;margin-top:22px;width:100%;max-width:330px}

  /* ── 后台 ── */
  .admin{
    position:fixed;inset:0;z-index:70;background:var(--paper);display:none;
    flex-direction:column;overflow:hidden;
  }
  .admin.show{display:flex}
  .admin-top{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;
  }
  .admin-top h2{margin:0;font-size:16px;font-weight:800}
  .admin-top .acts{display:flex;gap:8px;align-items:center}
  .mini{
    font:inherit;font-size:12.5px;font-weight:700;border-radius:9px;padding:7px 11px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink2);
  }
  .mini.pri{background:linear-gradient(135deg,var(--warm),var(--warm-d));color:#fff;border-color:transparent}
  .admin-body{flex:1 1 auto;overflow-y:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
  .arow{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:10px 11px;margin-bottom:9px;
  }
  .arow .idx{width:22px;flex:0 0 22px;font-size:11px;color:var(--ink3);font-weight:700;text-align:center}
  .arow .info{flex:1;min-width:0}
  .arow .info .n{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arow .info .m{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arow .ops{display:flex;gap:5px;flex:0 0 auto}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;
    color:var(--ink2);font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center;
  }
  .icon-btn:active{background:#FDF3EC}
  .icon-btn.del{color:#C2544A;border-color:#F3D9D3}
  .form-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .form-item label{display:block;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin-bottom:4px}
  .form-item input[type=text],.form-item input[type=number],.form-item textarea,.form-item select{
    width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:#FDFBF7;
    border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;
  }
  .form-item textarea{min-height:64px;resize:vertical;line-height:1.55}
  .form-item input:focus,.form-item textarea:focus,.form-item select:focus{border-color:var(--warm)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .range-row{display:flex;align-items:center;gap:10px}
  .range-row input[type=range]{flex:1;accent-color:var(--warm-d)}
  .range-row b{width:20px;font-size:12px;color:var(--ink2);text-align:right}
  .aphotos{display:flex;gap:7px;flex-wrap:wrap}
  .aphotos .ph{position:relative;width:62px;height:62px;border-radius:9px;overflow:hidden;background:#F3EBE2}
  .aphotos .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .aphotos .ph button{
    position:absolute;right:2px;top:2px;width:17px;height:17px;border-radius:50%;border:0;
    background:rgba(38,30,24,.62);color:#fff;font-size:10px;line-height:1;cursor:pointer;
    display:grid;place-items:center;
  }
  .aphotos .ph button.star{right:auto;left:2px;top:auto;bottom:2px;background:rgba(232,132,90,.92)}
  .aphotos .ph button.star.on{background:#C96A42}
  .toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    background:rgba(58,49,41,.93);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:.2s ease;z-index:90;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .empty{padding:44px 14px;text-align:center;color:var(--ink3);font-size:13px}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span><span id="brandTxt">小小菜单</span></div>

  <header class="hero">

    </div>
  </header>

  <nav class="filters" id="filters"></nav>
  <main class="mosaic" id="list"></main>
  <div class="foot" id="foot"></div>

<!-- 浮层：图集 + 详情 -->
<div class="modal" id="modal">
  <div class="panel">
    <div class="gal">
      <div class="gal-main" id="galMain">
        <button class="close-x" id="galClose" aria-label="关闭">✕</button>
        <span class="gcount" id="galCount">1/1</span>

    <div class="det" id="det"></div>

      <button class="go-btn" id="pickBtn">就这家</button>

</div>

<!-- 确认弹层 -->
<div class="sheet-mask" id="confirmMask">
  <div class="sheet">
    <h3>确认一下</h3>
    <p class="hint">确认之后就不改了。下面这句话可以按自己的说法改。</p>
    <textarea id="confirmText" rows="3"></textarea>
    <div class="rows">
      <button class="btn ghost" id="confirmCancel">返回</button>
      <button class="btn primary" id="confirmSend">确认</button>
    </div>
  </div>
</div>

<!-- 成功页 -->
<div class="done" id="done">
  <div class="mark"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
  <h2>已确认</h2>

  <div class="bubble"><div class="who">已记下</div><div id="doneText"></div></div>

<!-- 后台面板 -->
<div class="admin" id="admin">
  <div class="admin-top">
    <h2>菜单管理</h2>

      <button class="mini pri" id="addBtn">＋ 新增</button>
      <button class="mini" id="adminClose">退出</button>
    </div>
  </div>
  <div class="admin-body">
    <div style="font-size:11.5px;color:#A79684;line-height:1.6;margin:0 2px 10px">↑↓ 调整顺序，前台瀑布流就按这个顺序铺（刷新即见）。点 ✎ 能看 / 删这家店的图。</div>
    <div id="adminList"></div>
    <div id="adminForm" style="display:none"></div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================ 基础工具 ============================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let toastTimer;
function toast(msg, ms = 1900){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

const API = '/api/date';

/* ============================ 状态 ============================ */
let items = [];          // 前台菜单
let picked = null;       // 选中的 id
let filter = 'all';
let adminPw = sessionStorage.getItem('date_admin_pw') || '';
let adminItems = [];
let editing = null;      // 正在编辑的 item（null = 新增）
let openId = null;       // 浮层里正在看的 item id
let galIdx = 0;          // 图集当前第几张

const FILTERS = [
  { key:'all',   label:'全部',     test: () => true },
  { key:'light', label:'清淡',     test: r => r.taste_light >= 4, sort:(a,b)=> b.taste_light - a.taste_light },
  { key:'spicy', label:'能吃辣',   test: r => r.taste_spicy >= 3, sort:(a,b)=> b.taste_spicy - a.taste_spicy },
  { key:'dist',  label:'按距离',   test: () => true, sort:(a,b)=> a.dist_km - b.dist_km },
  { key:'near',  label:'两边都近', test: r => Math.min(r.dist_km, r.dist_work_km) <= 5 },
  { key:'cheap', label:'人均一百', test: r => r.price <= 110 }
];

/* ============================ 插图（纯内联，无外链） ============================ */
function art(kind, a, b){
  const gid = 'g' + kind + Math.random().toString(36).slice(2, 7);
  const steam = `
    <path d="M150 96c8-10-8-18 0-28" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M182 90c8-11-8-19 0-30" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M214 96c8-10-8-18 0-28" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5" stroke-linecap="round"/>`;
  const pot = `
    <ellipse cx="200" cy="176" rx="104" ry="16" fill="#000" opacity=".05"/>
    <path d="M104 132h192a96 96 0 0 1-96 54 96 96 0 0 1-96-54z" fill="#fff" fill-opacity=".92"/>
    <ellipse cx="200" cy="132" rx="96" ry="24" fill="#F7EFE4"/>
    <ellipse cx="200" cy="131" rx="84" ry="18" fill="#FBF7F1"/>`;

  const scenes = {
    porridge: `${pot}${steam}
      <ellipse cx="168" cy="130" rx="22" ry="8" fill="#F6CFB4" transform="rotate(-8 168 130)"/>
      <ellipse cx="214" cy="134" rx="24" ry="8" fill="#F8DAC4" transform="rotate(6 214 134)"/>
      <ellipse cx="196" cy="124" rx="18" ry="7" fill="#FADFCB" transform="rotate(-4 196 124)"/>
      <circle cx="238" cy="128" r="4" fill="#9CC58F"/><circle cx="152" cy="126" r="3.4" fill="#9CC58F"/>
      <ellipse cx="200" cy="197" rx="60" ry="7" fill="#E9DCCB" opacity=".55"/>`,
    beefpot: `${pot}${steam}
      <path d="M150 128c14-10 30-10 42 0-12 10-28 10-42 0z" fill="#E08C7A"/>
      <path d="M200 134c14-10 30-10 42 0-12 10-28 10-42 0z" fill="#D97D6B"/>
      <path d="M176 122c12-8 26-8 36 0-10 9-24 9-36 0z" fill="#EBA595"/>
      <circle cx="246" cy="124" r="3.6" fill="#9CC58F"/><circle cx="160" cy="136" r="3.2" fill="#9CC58F"/>`,
    sushi: `
      <rect x="0" y="168" width="400" height="10" fill="#fff" fill-opacity=".55"/>
      <rect x="0" y="178" width="400" height="6" fill="#fff" fill-opacity=".35"/>
      <g><rect x="104" y="126" width="52" height="34" rx="9" fill="#FBF7F1"/>
         <rect x="104" y="120" width="52" height="16" rx="8" fill="#F09A6E"/>
         <rect x="122" y="116" width="10" height="44" rx="4" fill="#4A4038" opacity=".75"/></g>
      <g><rect x="172" y="132" width="52" height="30" rx="9" fill="#FBF7F1"/>
         <rect x="172" y="126" width="52" height="15" rx="8" fill="#E8875C"/>
         <rect x="190" y="122" width="10" height="40" rx="4" fill="#4A4038" opacity=".75"/></g>
      <g><rect x="240" y="126" width="52" height="34" rx="9" fill="#FBF7F1"/>
         <rect x="240" y="120" width="52" height="16" rx="8" fill="#F6B98E"/>
         <circle cx="266" cy="112" r="6" fill="#9CC58F" opacity=".9"/></g>
      <circle cx="330" cy="120" r="12" fill="#DCE8DA"/><circle cx="330" cy="120" r="6" fill="#B7D2B3"/>`,
    thai: `
      <ellipse cx="200" cy="182" rx="96" ry="14" fill="#000" opacity=".05"/>
      <path d="M112 130h176a88 88 0 0 1-88 52 88 88 0 0 1-88-52z" fill="#fff" fill-opacity=".92"/>
      <ellipse cx="200" cy="130" rx="88" ry="22" fill="#F6E7C9"/>
      <ellipse cx="200" cy="129" rx="76" ry="16" fill="#F2D79E"/>${steam}
      <circle cx="172" cy="128" r="7" fill="#E08C6E"/><circle cx="206" cy="132" r="6" fill="#DC7F5F"/>
      <circle cx="234" cy="126" r="5" fill="#E08C6E"/>
      <path d="M138 122c10-6 20-6 30 0" stroke="#9CC58F" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M250 120c12-8 22-4 26 4" stroke="#7FA870" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    grill: `
      <rect x="70" y="118" width="260" height="72" rx="12" fill="#fff" fill-opacity=".9"/>
      <g stroke="#E7D6C2" stroke-width="2"><path d="M78 138h244"/><path d="M78 156h244"/><path d="M78 174h244"/></g>
      <path d="M116 168c-8-14 2-22 0-32 10 8 14 18 8 32z" fill="#E8845A" opacity=".9"/>
      <path d="M136 168c-7-12 1-19 0-28 9 7 12 16 7 28z" fill="#F2B872" opacity=".95"/>
      <rect x="168" y="132" width="46" height="20" rx="7" fill="#D97D6B" transform="rotate(-6 191 142)"/>
      <rect x="224" y="146" width="46" height="20" rx="7" fill="#C96A57" transform="rotate(5 247 156)"/>
      <circle cx="292" cy="140" r="4" fill="#C25B4B" opacity=".8"/>
      <circle cx="304" cy="154" r="3" fill="#C25B4B" opacity=".6"/>`,
    western: `
      <ellipse cx="200" cy="186" rx="118" ry="18" fill="#000" opacity=".05"/>
      <circle cx="200" cy="140" r="76" fill="#fff" fill-opacity=".95"/>
      <circle cx="200" cy="140" r="62" fill="none" stroke="#EFE3D6" stroke-width="2"/>
      <path d="M164 148c6-22 26-32 44-28 20 4 30 22 24 38-4 10-18 12-32 10-16-2-38-8-36-20z" fill="#B4705C"/>
      <path d="M176 142c8-14 26-20 40-16" stroke="#D9A08B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="246" cy="160" r="9" fill="#9CC58F"/><circle cx="234" cy="170" r="6" fill="#B7D2B3"/>
      <circle cx="158" cy="132" r="4" fill="#F3C77B"/>
      <path d="M300 96c6 10 2 16-2 20" stroke="#C9A0A8" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    chinese: `
      <ellipse cx="200" cy="188" rx="108" ry="16" fill="#000" opacity=".05"/>
      <circle cx="200" cy="140" r="72" fill="#fff" fill-opacity=".95"/>
      <circle cx="200" cy="140" r="58" fill="none" stroke="#EADFD0" stroke-width="2"/>
      <path d="M168 148c10-16 34-24 54-16 12 5 14 16 6 22-12 9-40 8-54 0-6-3-8-4-6-6z" fill="#C98B6B"/>
      <path d="M180 132c10-6 22-6 32-2" stroke="#E6BCA6" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="240" cy="128" r="7" fill="#9CC58F"/>
      <path d="M150 120c8-10 8-16 4-22" stroke="#fff" stroke-opacity=".9" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M256 118c8-10 8-16 4-22" stroke="#fff" stroke-opacity=".7" stroke-width="3" fill="none" stroke-linecap="round"/>`
  };
  const inner = scenes[kind] || scenes.porridge;
  return `<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="菜品插画">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${esc(a || '#FDF1E7')}"/><stop offset="1" stop-color="${esc(b || '#F8E2D2')}"/>
    </linearGradient></defs>
    <rect width="400" height="250" fill="url(#${gid})"/>
    <circle cx="330" cy="46" r="54" fill="#fff" opacity=".4"/>
    <circle cx="58" cy="206" r="42" fill="#fff" opacity=".28"/>
    ${inner}
  </svg>`;
}

/* ============================ 图片 ============================ */
function photosOf(r){
  if (Array.isArray(r.photos) && r.photos.length) return r.photos;
  if (r.photo) return [{ id:'', path: r.photo, w: 0, h: 0, caption:'', source_url:'' }];
  return [];
}
/* 封面比例：小红书上的店拍基本都是 3:4，一水儿竖图排出来像表格。
   这里按位置给一组目标比例，再和真实比例加权 —— 既有「错版」的节奏，
   又不会把竖图裁得只剩中间一条。 */
const RATIOS = [0.70, 1.05, 0.78, 0.66, 1.25, 0.86];
function coverHTML(r, i){
  const ps = photosOf(r);
  if (!ps.length) return art(r.art, r.accent_a, r.accent_b);
  const p = ps[0];
  const base = (p.w && p.h) ? clamp(p.w / p.h, .7, 1.35) : .78;
  const target = RATIOS[(i || 0) % RATIOS.length];
  const ratio = clamp(base * 0.45 + target * 0.55, .66, 1.15);
  return `<img src="${esc(p.path)}" alt="${esc(r.name)}" loading="lazy" decoding="async" style="aspect-ratio:${ratio.toFixed(3)}">`;
}

/* ============================ 渲染：前台 ============================ */
function bars(r){
  const rows = [['清','l',r.taste_light], ['辣','s',r.taste_spicy], ['油','o',r.taste_oil]];
  return rows.map(([lab, cls, v]) => `<div class="trow"><i>${lab}</i><span class="tbar"><b class="${cls}" style="width:${clamp(v,0,5) * 20}%"></b></span><em>${v}/5</em></div>`).join('');
}

function cardHTML(r, i){
  const ps = photosOf(r);
  const score = r.score > 0 ? `${r.score.toFixed(1)} 分` : '';
  return `<article class="card ${picked === r.id ? 'sel' : ''}" data-id="${esc(r.id)}" style="animation-delay:${Math.min(i,8) * 32}ms">
    <div class="cover">
      ${coverHTML(r, i)}
      <div class="shade"></div>
      <span class="badge taste ${esc(r.taste_kind)}">${esc(r.taste_label)}</span>
      <span class="badge dist">离家 ${r.dist_km.toFixed(1)} km</span>
      ${ps.length > 1 ? `<span class="badge count"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5-6 6"/></svg>${ps.length}</span>` : ''}
      <span class="tick">✓</span>
    </div>
    <div class="cbody">
      <h2 class="cname">${esc(r.name)}</h2>
      <p class="cmeta">${esc(r.cuisine)} · ${esc(r.branch)}</p>
      <div class="crow"><span class="p">¥${r.price}<small>/人</small></span><span class="s">${score}</span></div>
    </div>
  </article>`;
}

function renderFilters(){
  $('#filters').innerHTML = FILTERS.map(f => {
    const n = items.filter(f.test).length;
    return `<button class="chip ${f.key === filter ? 'on' : ''}" data-f="${f.key}">${f.label}${n ? '' : ' ·0'}</button>`;
  }).join('');
  $('#filters').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f; renderFilters(); renderList();
  }));
}

function renderList(){
  const f = FILTERS.find(x => x.key === filter) || FILTERS[0];
  // 顺序只有两个来源：后台排的（items 本身就是 sort 升序）或筛选器显式要求的排序。
  // 以前这里写了 f.sort || 按距离，结果后台怎么调都不生效 —— 别再偷偷重排。
  const rows = items.filter(f.test).slice();
  if (f.sort) rows.sort(f.sort);
  $('#list').innerHTML = rows.length
    ? rows.map(cardHTML).join('')
    : '<div class="empty" style="grid-column:1/-1">这个条件下暂时没有店 —— 换个筛选试试。</div>';
  $('#list').querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openSheet(el.dataset.id));
    const img = el.querySelector('.cover img');
    if (img) img.addEventListener('load', layoutMosaic, { once: true });
  });
  layoutMosaic();
}

/* 瀑布流：grid-auto-rows:4px，卡片高度量出来换算成跨行数。
   顺序仍是 DOM 顺序（左→右、上→下），跟后台的 sort 一致；错版来自封面比例不同。
   ⚠ 必须用 scrollHeight 量：卡片是 grid item，span 1 时盒高只剩 4px，
   getBoundingClientRect().height 量出来的就是这个 4px（第一版就栽在这，
   结果 22 张卡全部压成 2px 高、挤成一条线）。 */
let mosaicRAF = 0;
function layoutMosaic(){
  if (mosaicRAF) cancelAnimationFrame(mosaicRAF);
  mosaicRAF = requestAnimationFrame(() => {
    mosaicRAF = 0;
    const rowH = 4, gap = 10;
    document.querySelectorAll('#list .card').forEach(card => {
      const h = card.scrollHeight + 2 + gap;   // +2 = 上下边框
      card.style.gridRowEnd = `span ${Math.ceil(h / rowH)}`;
    });
  });
}
window.addEventListener('resize', layoutMosaic);

/* ============================ 浮层：图集 + 详情 ============================ */
function openSheet(id){
  const item = items.find(x => x.id === id);
  if (!item) return;
  openId = id; galIdx = 0;
  renderGallery(item);
  renderDetail(item);
  $('#modal').classList.add('show');
  document.body.style.overflow = 'hidden';
  if (history.replaceState) history.replaceState(null, '', '#r=' + encodeURIComponent(id));
}
function closeSheet(){
  $('#modal').classList.remove('show');
  document.body.style.overflow = '';
  openId = null;
  if (location.hash.startsWith('#r=')) history.replaceState(null, '', location.pathname + location.search);
}

function renderGallery(r){
  const ps = photosOf(r);
  const main = $('#galMain');
  main.querySelectorAll('img,.ph').forEach(n => n.remove());
  const prev = $('#galPrev'), next = $('#galNext');
  if (!ps.length){
    main.insertAdjacentHTML('afterbegin', `<div class="ph">${art(r.art, r.accent_a, r.accent_b)}</div>`);
    $('#galCount').style.display = 'none';
    $('#galThumbs').style.display = 'none';
    $('#galNote').textContent = '';
    prev.disabled = true; next.disabled = true;
    return;
  }
  $('#galCount').style.display = '';
  $('#galThumbs').style.display = ps.length > 1 ? '' : 'none';
  prev.disabled = ps.length < 2; next.disabled = ps.length < 2;
  $('#galThumbs').innerHTML = ps.map((p, i) =>
    `<button data-i="${i}" class="${i === 0 ? 'on' : ''}"><img src="${esc(p.path)}" alt="" loading="lazy"></button>`).join('');
  $('#galThumbs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => showImg(+b.dataset.i)));
  showImg(0, true);
}

function showImg(i, first){
  const r = items.find(x => x.id === openId); if (!r) return;
  const ps = photosOf(r); if (!ps.length) return;
  galIdx = (i + ps.length) % ps.length;
  const p = ps[galIdx];
  const main = $('#galMain');
  let img = main.querySelector('img');
  if (!img){
    img = document.createElement('img');
    main.insertBefore(img, main.firstChild);
  }
  const apply = () => {
    img.src = p.path; img.alt = r.name;
    $('#galCount').textContent = `${galIdx + 1}/${ps.length}`;
    $('#galNote').textContent = p.caption || '';
    $('#galThumbs').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === galIdx));
    const on = $('#galThumbs button.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block:'nearest', inline:'center' });
  };
  if (first){ apply(); return; }
  img.classList.add('fade');
  const nx = new Image();
  nx.onload = () => { apply(); img.classList.remove('fade'); };
  nx.onerror = () => { apply(); img.classList.remove('fade'); };
  nx.src = p.path;
}

function renderDetail(r){
  const score = r.score > 0 ? ` · ${r.score.toFixed(1)} 分` : '';
  $('#det').innerHTML = `
    <h2>${esc(r.name)}</h2>
    <p class="sub">${esc(r.cuisine)}<span class="sep">·</span>${esc(r.branch)}${score}</p>
    <div class="facts">
      <div class="fact"><b>¥${r.price}</b><span>人均</span></div>
      <div class="fact"><b>${r.dist_km.toFixed(1)}<span style="font-size:9.5px">km</span></b><span>离她家</span></div>
      <div class="fact"><b>${r.dist_work_km.toFixed(1)}<span style="font-size:9.5px">km</span></b><span>离她公司</span></div>
    </div>
    <div class="taste">${bars(r)}</div>
    <div class="why"><b>为什么是这家</b><p>${esc(r.reason)}</p></div>
    <div class="go">
      <b>怎么去</b>
      <div>${esc(r.metro)}</div>
      <div>${esc(r.reach)}</div>
    </div>
    <div class="tip"><b>点菜小抄</b>${esc(r.tip)}</div>
    <div style="height:6px"></div>`;
  $('#footName').textContent = r.name;
  $('#footMeta').textContent = `${r.cuisine} · ¥${r.price}/人 · 离家 ${r.dist_km.toFixed(1)} km`;
  $('#det').scrollTop = 0;
}

/* 图集手势：左右滑 / 方向键 / 两侧按钮 */
(function(){
  const main = $('#galMain');
  let x0 = null, y0 = null;
  main.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  main.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    x0 = y0 = null;
    if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.4) showImg(galIdx + (dx < 0 ? 1 : -1));
  }, { passive: true });
  $('#galPrev').addEventListener('click', e => { e.stopPropagation(); showImg(galIdx - 1); });
  $('#galNext').addEventListener('click', e => { e.stopPropagation(); showImg(galIdx + 1); });
  $('#galClose').addEventListener('click', closeSheet);
  $('#footClose').addEventListener('click', closeSheet);
  $('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeSheet(); });
})();

/* ============================ 拉数据 ============================ */
async function loadMenu(){
  try{
    const res = await fetch(`${API}/menu`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    items = await res.json();
  } catch(e){
    $('#countNote').textContent = '菜单没加载出来，刷新一下试试';
    console.error(e); return;
  }
  const withPic = items.filter(r => photosOf(r).length).length;
  $('#countNote').textContent = items.length
    ? `共 ${items.length} 家${withPic ? ` · ${withPic} 家有实拍` : ''}`
    : '菜单还是空的';
  $('#foot').innerHTML = '口味按「清 / 辣 / 油」分三档，0–5 是主观体感。两个距离都是直线距离：家＝三花国际，公司＝黄龙体育中心。点开卡片能翻实拍图。';
  renderFilters(); renderList();

  const to = new URLSearchParams(location.search).get('to');
  if (to) $('#hello').innerHTML = `${esc(to)}，今晚<em>吃什么</em>`;

  // 分享链接带 #r=<id>：直接展开那一家
  const m = location.hash.match(/^#r=(.+)$/);
  if (m) openSheet(decodeURIComponent(m[1]));
}

/* ============================ 确认 + 发送 ============================ */
function openConfirm(){
  const item = items.find(x => x.id === (openId || picked));
  if (!item) return;
  picked = item.id;
  document.querySelectorAll('#list .card').forEach(el => el.classList.toggle('sel', el.dataset.id === picked));
  $('#confirmText').value = `我选择${item.name}`;
  $('#confirmMask').classList.add('show');
  setTimeout(() => $('#confirmText').focus(), 260);
}

async function sendChoice(){
  const text = $('#confirmText').value.trim();
  if (!text){ toast('写一句再确认'); return; }
  const btn = $('#confirmSend');
  btn.disabled = true; btn.textContent = '确认中…';
  try{
    const res = await fetch(`${API}/choose`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, restaurant_id: picked })
    });
    if (!res.ok){
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || ('HTTP ' + res.status));
    }
    const data = await res.json();
    $('#confirmMask').classList.remove('show');
    closeSheet();
    $('#doneText').textContent = data.text;
    $('#done').classList.add('show');
  } catch(e){
    toast('没成功：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '确认';
  }
}

/* ============================ 后台 ============================ */
async function adminFetch(path, opts = {}){
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Date-Password': adminPw, ...(opts.headers || {}) }
  });
  if (res.status === 401){ throw new Error('密码不对'); }
  if (!res.ok){
    const d = await res.json().catch(() => ({}));
    throw new Error(d.detail || ('HTTP ' + res.status));
  }
  return res.status === 204 ? null : res.json();
}

async function openAdmin(){
  if (!adminPw){ $('#gateMask').classList.add('show'); setTimeout(() => $('#pwInput').focus(), 250); return; }
  try{ await adminFetch('/admin/check', { method: 'POST' }); }
  catch(e){ adminPw = ''; sessionStorage.removeItem('date_admin_pw'); $('#gateMask').classList.add('show'); return; }
  $('#admin').classList.add('show'); await loadAdmin();
}

async function loadAdmin(){
  try{
    adminItems = await adminFetch('/admin/items');
    document.getElementById('adminForm').style.display = 'none';
    renderAdminList();
  } catch(e){ toast(e.message); }
}

function renderAdminList(){
  const box = $('#adminList');
  box.innerHTML = adminItems.map((r, i) => `
    <div class="arow" data-id="${esc(r.id)}">
      <div class="idx">${i + 1}</div>
      <div class="info">
        <div class="n">${esc(r.name)}${r.hidden ? ' <span style="color:#B9A6A0;font-weight:600">（隐藏）</span>' : ''}</div>
        <div class="m">${esc(r.cuisine)} · ¥${r.price} · 家 ${r.dist_km.toFixed(1)} / 司 ${r.dist_work_km.toFixed(1)} km · 图 ${(r.photos || []).length}</div>
      </div>
      <div class="ops">
        <button class="icon-btn" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="icon-btn" data-act="down" ${i === adminItems.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="icon-btn" data-act="edit">✎</button>
        <button class="icon-btn del" data-act="del">✕</button>
      </div>
    </div>`).join('') || '<div class="empty">还没有条目，点右上角「＋ 新增」。</div>';

  box.querySelectorAll('.arow').forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll('.icon-btn').forEach(btn => btn.addEventListener('click', async () => {
      const act = btn.dataset.act;
      if (act === 'edit'){ editing = adminItems.find(x => x.id === id); renderForm(editing); return; }
      if (act === 'del'){
        if (!confirm('删掉「' + (adminItems.find(x => x.id === id) || {}).name + '」？')) return;
        try{ await adminFetch('/items/' + id, { method: 'DELETE' }); await loadAdmin(); await loadMenu(); toast('删掉了'); }
        catch(e){ toast(e.message); }
        return;
      }
      const idx = adminItems.findIndex(x => x.id === id);
      const to = act === 'up' ? idx - 1 : idx + 1;
      if (to < 0 || to >= adminItems.length) return;
      const arr = adminItems.slice();
      [arr[idx], arr[to]] = [arr[to], arr[idx]];
      try{
        await adminFetch('/reorder', { method: 'POST', body: JSON.stringify({ ids: arr.map(x => x.id) }) });
        await loadAdmin(); await loadMenu();
      } catch(e){ toast(e.message); }
    }));
  });
}

const ART_OPTS = [['porridge','粥锅'],['beefpot','牛肉锅'],['sushi','寿司'],['thai','泰式'],['grill','铁板'],['western','西餐'],['chinese','中式']];
const KIND_OPTS = [['light','清淡（绿）'],['spicy','偏辣（红）'],['oil','偏油（黄）']];

function renderForm(r){
  const d = r || { name:'', branch:'', cuisine:'', price:100, score:4.5, taste_light:3, taste_spicy:0, taste_oil:2,
                    taste_label:'清淡', taste_kind:'light', reason:'', metro:'', reach:'', tip:'',
                    dist_km:5, dist_work_km:5, art:'porridge', accent_a:'#FDF1E7', accent_b:'#F8E2D2', photos:[], hidden:false };
  const box = document.getElementById('adminForm');
  box.style.display = 'block';
  const phs = (d.photos || []);
  box.innerHTML = `
    <div class="form-item"><label>店名 *</label><input type="text" id="f_name" value="${esc(d.name)}"></div>
    <div class="grid2">
      <div class="form-item"><label>分店</label><input type="text" id="f_branch" value="${esc(d.branch)}"></div>
      <div class="form-item"><label>菜系</label><input type="text" id="f_cuisine" value="${esc(d.cuisine)}"></div>
    </div>
    <div class="grid2">
      <div class="form-item"><label>人均（¥）</label><input type="number" id="f_price" value="${d.price}"></div>
      <div class="form-item"><label>评分（0 = 不显示）</label><input type="number" step="0.1" id="f_score" value="${d.score}"></div>
    </div>
    <div class="grid2">
      <div class="form-item"><label>离家 km（三花国际）</label><input type="number" step="0.1" id="f_dist" value="${d.dist_km}"></div>
      <div class="form-item"><label>离公司 km（黄龙体育中心）</label><input type="number" step="0.1" id="f_distw" value="${d.dist_work_km}"></div>
    </div>
    <div class="grid2">
      <div class="form-item"><label>角标文案</label><input type="text" id="f_tlabel" value="${esc(d.taste_label)}"></div>
      <div class="form-item"><label>角标配色</label>
        <select id="f_tkind">${KIND_OPTS.map(([v,t]) => `<option value="${v}" ${d.taste_kind===v?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="form-item"><label>清淡度 <b id="v_light">${d.taste_light}</b>/5</label>
      <div class="range-row"><input type="range" min="0" max="5" id="f_light" value="${d.taste_light}"></div></div>
    <div class="form-item"><label>辣度 <b id="v_spicy">${d.taste_spicy}</b>/5</label>
      <div class="range-row"><input type="range" min="0" max="5" id="f_spicy" value="${d.taste_spicy}"></div></div>
    <div class="form-item"><label>油度 <b id="v_oil">${d.taste_oil}</b>/5</label>
      <div class="range-row"><input type="range" min="0" max="5" id="f_oil" value="${d.taste_oil}"></div></div>
    <div class="form-item"><label>为什么是这家</label><textarea id="f_reason">${esc(d.reason)}</textarea></div>
    <div class="form-item"><label>最近地铁 + 步行</label><textarea id="f_metro">${esc(d.metro)}</textarea></div>
    <div class="form-item"><label>怎么过去（从家出发）</label><textarea id="f_reach">${esc(d.reach)}</textarea></div>
    <div class="form-item"><label>点菜小抄</label><textarea id="f_tip">${esc(d.tip)}</textarea></div>
    <div class="form-item"><label>实拍图（${phs.length} 张，★ 设为封面，✕ 删）</label>
      ${phs.length ? `<div class="aphotos">${phs.map((p, idx) => `<div class="ph"><img src="${esc(p.path)}" alt="">
          <button class="star ${idx === 0 ? 'on' : ''}" data-idx="${idx}" title="设为封面">★</button>
          <button data-pid="${esc(p.id)}" title="删掉">✕</button></div>`).join('')}</div>`
                   : '<div style="font-size:12px;color:#A79684">还没有图，前台显示占位插画。</div>'}
    </div>
    <div class="grid2">
      <div class="form-item"><label>插画</label>
        <select id="f_art">${ART_OPTS.map(([v,t]) => `<option value="${v}" ${d.art===v?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="form-item"><label>隐藏（前台不显示）</label>
        <select id="f_hidden"><option value="0" ${!d.hidden?'selected':''}>显示</option><option value="1" ${d.hidden?'selected':''}>隐藏</option></select></div>
    </div>
    <div class="rows">
      <button class="btn ghost" id="fCancel">取消</button>
      <button class="btn primary" id="fSave">保存</button>
    </div>`;

  ['light','spicy','oil'].forEach(k => {
    const el = document.getElementById('f_' + k);
    const out = document.getElementById('v_' + k);
    el.addEventListener('input', () => out.textContent = el.value);
  });
  box.querySelectorAll('.aphotos button').forEach(b => b.addEventListener('click', async () => {
    if (b.classList.contains('star')){
      // 设为封面 = 把这张挪到队首，整组重写（接口是整组替换，顺序即封面）
      const idx = +b.dataset.idx;
      if (!idx) return;
      const arr = phs.slice();
      const [pick] = arr.splice(idx, 1);
      arr.unshift(pick);
      try{
        await adminFetch('/items/' + d.id + '/photos', { method: 'POST', body: JSON.stringify({
          photos: arr.map(p => ({ path: p.path, w: p.w, h: p.h, caption: p.caption || '', source_url: p.source_url || '' }))
        }) });
        await loadAdmin(); await loadMenu();
        renderForm(adminItems.find(x => x.id === d.id));
        toast('换成封面了');
      } catch(e){ toast(e.message); }
      return;
    }
    if (!confirm('删掉这张图？')) return;
    try{
      await adminFetch('/photos/' + b.dataset.pid, { method: 'DELETE' });
      await loadAdmin(); await loadMenu();
      renderForm(adminItems.find(x => x.id === d.id));
      toast('删掉了');
    } catch(e){ toast(e.message); }
  }));

  document.getElementById('fCancel').addEventListener('click', () => {
    box.style.display = 'none'; box.innerHTML = '';
  });
  document.getElementById('fSave').addEventListener('click', () => saveForm(r && r.id));
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function saveForm(id){
  const val = (s) => document.getElementById(s).value.trim();
  const num = (s) => Number(document.getElementById(s).value || 0);
  const body = {
    name: val('f_name'), branch: val('f_branch'), cuisine: val('f_cuisine'),
    price: num('f_price'), score: num('f_score'), dist_km: num('f_dist'), dist_work_km: num('f_distw'),
    taste_light: num('f_light'), taste_spicy: num('f_spicy'), taste_oil: num('f_oil'),
    taste_label: val('f_tlabel') || '清淡', taste_kind: document.getElementById('f_tkind').value,
    reason: val('f_reason'), metro: val('f_metro'), reach: val('f_reach'), tip: val('f_tip'),
    art: document.getElementById('f_art').value,
    accent_a: (editing && editing.accent_a) || '#FDF1E7',
    accent_b: (editing && editing.accent_b) || '#F8E2D2',
    hidden: document.getElementById('f_hidden').value === '1'
  };
  if (!body.name){ toast('店名不能空'); return; }
  try{
    if (id) await adminFetch('/items/' + id, { method: 'PATCH', body: JSON.stringify(body) });
    else    await adminFetch('/items', { method: 'POST', body: JSON.stringify(body) });
    toast('保存好了');
    await loadAdmin(); await loadMenu();
  } catch(e){ toast(e.message); }
}

/* ============================ 事件绑定 ============================ */
$('#pickBtn').addEventListener('click', openConfirm);
$('#confirmCancel').addEventListener('click', () => $('#confirmMask').classList.remove('show'));
$('#confirmSend').addEventListener('click', sendChoice);
$('#doneClose').addEventListener('click', () => { $('#done').classList.remove('show'); picked = null; });
$('#doneBack').addEventListener('click', () => {
  $('#done').classList.remove('show'); picked = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$('#gear').addEventListener('click', openAdmin);
$('#gateCancel').addEventListener('click', () => $('#gateMask').classList.remove('show'));
$('#gateGo').addEventListener('click', async () => {
  const pw = $('#pwInput').value.trim();
  adminPw = pw;
  try{
    await adminFetch('/admin/check', { method: 'POST' });
    sessionStorage.setItem('date_admin_pw', pw);
    $('#gateMask').classList.remove('show');
    $('#pwInput').value = '';
    $('#admin').classList.add('show');
    await loadAdmin();
  } catch(e){
    adminPw = ''; sessionStorage.removeItem('date_admin_pw');
    toast(e.message === '密码不对' ? '密码不对' : e.message);
  }
});
$('#adminClose').addEventListener('click', () => { $('#admin').classList.remove('show'); loadMenu(); });
$('#addBtn').addEventListener('click', () => { editing = null; renderForm(null); });
$('#pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#gateGo').click(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    if ($('#confirmMask').classList.contains('show')){ $('#confirmMask').classList.remove('show'); return; }
    if ($('#modal').classList.contains('show')){ closeSheet(); return; }
    document.querySelectorAll('.sheet-mask.show').forEach(m => m.classList.remove('show'));
    return;
  }
  if ($('#modal').classList.contains('show') && !$('#confirmMask').classList.contains('show')){
    if (e.key === 'ArrowLeft') showImg(galIdx - 1);
    if (e.key === 'ArrowRight') showImg(galIdx + 1);
  }
});

loadMenu();
</script>
