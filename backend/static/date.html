<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小小菜单 · 今晚吃什么</title>
<!--
  /date —— 挑餐厅（selfsec 的一个页面，跟着 static/ 一起托管）

  页面职责：
    1. 前台：展示菜单（GET /api/date/menu，不需要 token）→ 挑一家 → 确认弹层里
       那句话可以改 → POST /api/date/choose，落一条 messages(role=me)。
       文案刻意克制：不出现"发给谁""他"这类指向，就是"确认一下"。
    2. 后台：右上角半透明小齿轮 → 输入密码
       （DATE_ADMIN_PASSWORD，请求头 X-Date-Password）→ 增删改 + 上下移排序。

  零依赖零构建，跟着 selfsec 的 static/ 一起被 StaticFiles 托管。
-->
<style>
  :root{
    --paper:#FBF7F1; --card:#FFFFFF;
    --ink:#3A3129; --ink2:#6E6055; --ink3:#A79684;
    --line:#F0E6DA; --line2:#F8F2E9;
    --warm:#E8845A; --warm-d:#C96A42; --amber:#F2B872;
    --green:#5F8F5F; --red:#C25B4B;
    --shadow:0 1px 2px rgba(120,90,60,.05), 0 10px 26px rgba(120,90,60,.07);
    --shadow-s:0 1px 2px rgba(120,90,60,.05), 0 4px 12px rgba(120,90,60,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;padding:0;color:var(--ink);font-size:15px;line-height:1.68;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(560px 320px at 90% -8%, #FFF3E4 0%, rgba(255,243,228,0) 62%),
      radial-gradient(520px 300px at 2% 4%, #FDF6EC 0%, rgba(253,246,236,0) 58%),
      var(--paper);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:540px;margin:0 auto;padding:0 16px}
  @media(min-width:720px){ .wrap{max-width:640px} }

  /* ── 顶栏 ── */
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 6px}
  .brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--ink2)}
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg,var(--warm),var(--amber));
    box-shadow:0 0 0 4px rgba(232,132,90,.12);
  }
  .gear{
    border:0;background:transparent;color:var(--ink3);opacity:.28;font-size:16px;
    padding:8px;cursor:pointer;line-height:1;
  }
  .gear:active{opacity:.6}

  /* ── 抬头 ── */
  .hero{padding:8px 2px 16px}
  .hero h1{
    margin:0 0 8px;font-size:27px;line-height:1.28;letter-spacing:-.5px;font-weight:800;
  }
  .hero h1 em{font-style:normal;color:var(--warm-d)}
  .hero p{margin:0;font-size:13.5px;color:var(--ink2)}
  .hero .note{
    margin-top:11px;display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;color:var(--ink3);background:#fff;border:1px dashed var(--line);
    border-radius:999px;padding:5px 11px;
  }

  /* ── 筛选 ── */
  .filters{
    position:sticky;top:0;z-index:6;display:flex;gap:8px;overflow-x:auto;
    margin:0 -16px;padding:10px 16px 11px;scrollbar-width:none;
    background:linear-gradient(180deg,rgba(255,249,245,.97),rgba(255,249,245,.84));
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;
    cursor:pointer;box-shadow:var(--shadow-s);transition:.16s ease;white-space:nowrap;
  }
  .chip:active{transform:scale(.96)}
  .chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--warm),var(--amber))}

  /* ── 卡片 ── */
  .list{display:flex;flex-direction:column;gap:15px;padding:16px 0 8px}
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.2s ease;
    animation:rise .3s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card:active{transform:scale(.994)}
  .card.sel{border-color:var(--warm);box-shadow:0 0 0 2px rgba(232,132,90,.25),var(--shadow)}
  .thumb{position:relative;aspect-ratio:16/10;background:#FBF1EC;overflow:hidden}
  .thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
  .pill{
    position:absolute;font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 9px;
    backdrop-filter:blur(6px);
  }
  .pill.dist{left:10px;top:10px;color:#fff;background:rgba(58,49,41,.58)}
  .pill.taste{right:10px;top:10px;background:rgba(255,255,255,.92);border:1px solid #fff}
  .pill.taste.light{color:#4E8A5C}
  .pill.taste.spicy{color:#C2544A}
  .pill.taste.oil{color:#A67517}
  .tick{
    position:absolute;left:10px;bottom:10px;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;font-size:13px;color:#fff;
    background:linear-gradient(135deg,var(--warm),var(--warm-d));
    opacity:0;transform:scale(.7);transition:.16s ease;
  }
  .card.sel .tick{opacity:1;transform:none}

  .body{padding:13px 15px 15px}
  .name{margin:0 0 3px;font-size:17.5px;font-weight:800;letter-spacing:-.2px;line-height:1.34}
  .sub{margin:0 0 11px;font-size:12.5px;color:var(--ink2)}
  .sub .sep{margin:0 6px;color:var(--ink3)}

  .facts{display:flex;gap:7px;margin:0 0 12px}
  .fact{flex:1;background:var(--line2);border-radius:11px;padding:7px 6px;text-align:center}
  .fact b{display:block;font-size:14px;font-weight:800;line-height:1.35}
  .fact span{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}

  .taste{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
  .trow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2)}
  .trow i{width:20px;flex:0 0 20px;font-style:normal;font-weight:700;color:var(--ink3)}
  .tbar{flex:1;height:5px;border-radius:99px;background:#F8EDE8;overflow:hidden}
  .tbar b{display:block;height:100%;border-radius:99px}
  .tbar b.l{background:linear-gradient(90deg,#B6DCAF,#6FA878)}
  .tbar b.s{background:linear-gradient(90deg,#F0B2A2,#C2544A)}
  .tbar b.o{background:linear-gradient(90deg,#F6D79E,#C78F2C)}
  .trow em{width:24px;flex:0 0 24px;text-align:right;font-style:normal;color:var(--ink3);font-variant-numeric:tabular-nums}

  .why{margin:0 0 11px;font-size:13.5px;color:var(--ink2);line-height:1.62}
  .why b,.tip b,.go b{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--ink3);font-weight:700;margin-bottom:3px}
  .why p{margin:0}

  .go{background:#FDFAF5;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;margin:0 0 10px}
  .go div{font-size:12.5px;color:var(--ink2);line-height:1.6}
  .go div+div{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
  .tip{font-size:12.5px;color:#8A6A3E;background:#FDF7EA;border:1px solid #F2E5C8;border-radius:11px;padding:9px 12px;line-height:1.6}
  .tip b{color:#A67F33}

  /* ── 底部选择条 ── */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(255,249,245,.9),rgba(255,249,245,.99));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
  }
  .bar .inner{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:12px}
  @media(min-width:720px){ .bar .inner{max-width:640px} }
  .bar .pick{flex:1;min-width:0}
  .bar .pick .k{font-size:10.5px;color:var(--ink3);letter-spacing:.1em;font-weight:700}
  .bar .pick .v{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .pick .v.empty{color:var(--ink3);font-weight:600}
  .go-btn{
    flex:0 0 auto;font:inherit;font-size:15px;font-weight:800;color:#fff;border:0;cursor:pointer;
    border-radius:13px;padding:13px 22px;
    background:linear-gradient(135deg,var(--warm),var(--warm-d));
    box-shadow:0 6px 18px rgba(201,106,66,.26);transition:.16s ease;
  }
  .go-btn:active{transform:scale(.97)}
  .go-btn[disabled]{background:#E9E1D6;color:#B3A695;box-shadow:none;cursor:not-allowed}

  /* ── 弹层通用 ── */
  .sheet-mask{
    position:fixed;inset:0;z-index:40;background:rgba(58,49,41,.34);
    backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(12px);transition:transform .22s cubic-bezier(.2,.8,.3,1);
    box-shadow:0 -10px 36px rgba(90,70,50,.14);
  }
  .sheet-mask.show .sheet{transform:none}
  @media(min-width:620px){
    .sheet-mask{align-items:center}
    .sheet{border-radius:18px;margin:0 16px;max-width:520px}
  }
  .sheet h3{margin:0 0 6px;font-size:16.5px;font-weight:800;letter-spacing:-.2px}
  .sheet .hint{margin:0 0 12px;font-size:12.5px;color:var(--ink2);line-height:1.6}
  .sheet textarea{
    width:100%;min-height:86px;resize:vertical;font:inherit;font-size:14.5px;color:var(--ink);
    background:#FDFBF7;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
    line-height:1.6;outline:none;
  }
  .sheet textarea:focus{border-color:var(--warm)}
  .sheet .rows{display:flex;gap:10px;margin-top:14px}
  .btn{
    flex:1;font:inherit;font-size:14.5px;font-weight:700;border-radius:12px;padding:12px 10px;
    cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink2);transition:.16s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--warm),var(--warm-d))}
  .btn.ghost{background:#FDFBF7}
  .btn.danger{color:#C2544A;border-color:#F6D8D2}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}

  /* ── 成功页 ── */
  .done{
    position:fixed;inset:0;z-index:50;background:var(--paper);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 22px calc(28px + env(safe-area-inset-bottom));text-align:center;
  }
  .done.show{display:flex}
  .done .mark{
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin-bottom:16px;
    background:linear-gradient(135deg,#FBEFE4,#F7E2CF);border:1px solid #F2DEC8;
    animation:pop .3s ease both;
  }
  .done .mark svg{width:24px;height:24px;stroke:var(--warm-d);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
  .done h2{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.3px}
  .done p{margin:0 0 18px;font-size:13px;color:var(--ink2);line-height:1.7}
  .done .bubble{
    max-width:330px;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 15px;font-size:14px;box-shadow:var(--shadow-s);color:var(--ink);
    text-align:left;word-break:break-word;
  }
  .done .bubble .who{font-size:10.5px;color:var(--ink3);letter-spacing:.1em;font-weight:700;margin-bottom:4px}
  .done .acts{display:flex;gap:10px;margin-top:22px;width:100%;max-width:330px}

  /* ── 后台 ── */
  .admin{
    position:fixed;inset:0;z-index:60;background:var(--paper);display:none;
    flex-direction:column;overflow:hidden;
  }
  .admin.show{display:flex}
  .admin-top{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;
  }
  .admin-top h2{margin:0;font-size:16px;font-weight:800}
  .admin-top .acts{display:flex;gap:8px;align-items:center}
  .mini{
    font:inherit;font-size:12.5px;font-weight:700;border-radius:9px;padding:7px 11px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink2);
  }
  .mini.pri{background:linear-gradient(135deg,var(--warm),var(--warm-d));color:#fff;border-color:transparent}
  .admin-body{flex:1 1 auto;overflow-y:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
  .arow{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:10px 11px;margin-bottom:9px;
  }
  .arow .idx{width:22px;flex:0 0 22px;font-size:11px;color:var(--ink3);font-weight:700;text-align:center}
  .arow .info{flex:1;min-width:0}
  .arow .info .n{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arow .info .m{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arow .ops{display:flex;gap:5px;flex:0 0 auto}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;
    color:var(--ink2);font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center;
  }
  .icon-btn:active{background:#FDF3EC}
  .icon-btn.del{color:#C2544A;border-color:#F3D9D3}
  .form-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .form-item label{display:block;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin-bottom:4px}
  .form-item input[type=text],.form-item input[type=number],.form-item textarea,.form-item select{
    width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:#FDFBF7;
    border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;
  }
  .form-item textarea{min-height:64px;resize:vertical;line-height:1.55}
  .form-item input:focus,.form-item textarea:focus,.form-item select:focus{border-color:var(--warm)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .range-row{display:flex;align-items:center;gap:10px}
  .range-row input[type=range]{flex:1;accent-color:var(--warm-d)}
  .range-row b{width:20px;font-size:12px;color:var(--ink2);text-align:right}
  .toast{
    position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    background:rgba(58,49,41,.93);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:.2s ease;z-index:80;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .empty{padding:44px 14px;text-align:center;color:var(--ink3);font-size:13px}
  .foot{margin:14px 2px 0;font-size:11px;color:var(--ink3);line-height:1.7}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span><span id="brandTxt">小小菜单</span></div>
    <button class="gear" id="gear" aria-label="管理">⚙</button>
  </div>

  <header class="hero">
    <h1 id="hello">今晚<em>吃什么</em></h1>
    <p>挑一家你想去的，剩下的我来。</p>
    <div class="note" id="countNote">正在加载菜单…</div>
  </header>

  <nav class="filters" id="filters"></nav>
  <main class="list" id="list"></main>
  <div class="foot" id="foot"></div>
</div>

<div class="bar">
  <div class="inner">
    <div class="pick">
      <div class="k">已选</div>
      <div class="v empty" id="pickTxt">还没选</div>
    </div>
    <button class="go-btn" id="goBtn" disabled>确认这家</button>
  </div>
</div>

<!-- 确认弹层 -->
<div class="sheet-mask" id="confirmMask">
  <div class="sheet">
    <h3>确认一下</h3>
    <p class="hint">确认之后就不改了。下面这句话可以按自己的说法改。</p>
    <textarea id="confirmText" rows="3"></textarea>
    <div class="rows">
      <button class="btn ghost" id="confirmCancel">返回</button>
      <button class="btn primary" id="confirmSend">确认</button>
    </div>
  </div>
</div>

<!-- 成功页 -->
<div class="done" id="done">
  <div class="mark"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
  <h2>已确认</h2>
  <p>记下了。想换随时回来改。</p>
  <div class="bubble"><div class="who">已记下</div><div id="doneText"></div></div>
  <div class="acts">
    <button class="btn ghost" id="doneBack">重新选</button>
    <button class="btn primary" id="doneClose">好了</button>
  </div>
</div>

<!-- 后台密码 -->
<div class="sheet-mask" id="gateMask">
  <div class="sheet">
    <h3>后台</h3>
    <p class="hint">输入密码才能改菜单。</p>
    <textarea id="pwInput" rows="1" placeholder="密码" style="min-height:0;height:46px"></textarea>
    <div class="rows">
      <button class="btn ghost" id="gateCancel">取消</button>
      <button class="btn primary" id="gateGo">进入</button>
    </div>
  </div>
</div>

<!-- 后台面板 -->
<div class="admin" id="admin">
  <div class="admin-top">
    <h2>菜单管理</h2>
    <div class="acts">
      <button class="mini pri" id="addBtn">＋ 新增</button>
      <button class="mini" id="adminClose">退出</button>
    </div>
  </div>
  <div class="admin-body">
    <div style="font-size:11.5px;color:#A79684;line-height:1.6;margin:0 2px 10px">↑↓ 调整顺序，前台就按这个顺序显示（刷新即见）。</div>
    <div id="adminList"></div>
    <div id="adminForm" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================ 基础工具 ============================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(msg, ms = 1900){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

const API = '/api/date';

/* ============================ 状态 ============================ */
let items = [];          // 前台菜单
let picked = null;       // 选中的 id
let filter = 'all';
let adminPw = sessionStorage.getItem('date_admin_pw') || '';
let adminItems = [];
let editing = null;      // 正在编辑的 item（null = 新增）

const FILTERS = [
  { key:'all',   label:'全部',     test: () => true },
  { key:'light', label:'清淡',     test: r => r.taste_light >= 4, sort:(a,b)=> b.taste_light - a.taste_light },
  { key:'spicy', label:'能吃辣',   test: r => r.taste_spicy >= 3, sort:(a,b)=> b.taste_spicy - a.taste_spicy },
  { key:'dist',  label:'按距离',   test: () => true, sort:(a,b)=> a.dist_km - b.dist_km },
  { key:'near',  label:'两边都近', test: r => Math.min(r.dist_km, r.dist_work_km) <= 5 },
  { key:'cheap', label:'人均一百', test: r => r.price <= 110 }
];

/* ============================ 插图（纯内联，无外链） ============================ */
function art(kind, a, b){
  const gid = 'g' + kind + Math.random().toString(36).slice(2, 7);
  const steam = `
    <path d="M150 96c8-10-8-18 0-28" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M182 90c8-11-8-19 0-30" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3.5" stroke-linecap="round"/>

/* ============================ 渲染：前台 ============================ */
function bars(r){
  const rows = [['清','l',r.taste_light], ['辣','s',r.taste_spicy], ['油','o',r.taste_oil]];
  return rows.map(([lab, cls, v]) => `<div class="trow"><i>${lab}</i><span class="tbar"><b class="${cls}" style="width:${Math.max(0, Math.min(5, v)) * 20}%"></b></span><em>${v}/5</em></div>`).join('');
}

function cardHTML(r, i){
  const img = r.photo ? `<img src="${esc(r.photo)}" alt="${esc(r.name)}" loading="lazy">` : art(r.art, r.accent_a, r.accent_b);
  const score = r.score > 0 ? ` · ${r.score.toFixed(1)} 分` : '';
  return `<article class="card ${picked === r.id ? 'sel' : ''}" data-id="${esc(r.id)}" style="animation-delay:${Math.min(i,6) * 45}ms">
    <div class="thumb">
      ${img}
      <span class="pill dist">离家 ${r.dist_km.toFixed(1)} km</span>
      <span class="pill taste ${esc(r.taste_kind)}">${esc(r.taste_label)}</span>
      <span class="tick">✓</span>
    </div>
    <div class="body">
      <h2 class="name">${esc(r.name)}</h2>
      <p class="sub">${esc(r.cuisine)}<span class="sep">·</span>${esc(r.branch)}${score}</p>
      <div class="facts">
        <div class="fact"><b>¥${r.price}</b><span>人均</span></div>
        <div class="fact"><b>${r.dist_km.toFixed(1)}<span style="font-size:9.5px">km</span></b><span>离她家</span></div>
        <div class="fact"><b>${r.dist_work_km.toFixed(1)}<span style="font-size:9.5px">km</span></b><span>离她公司</span></div>
      </div>
      <div class="taste">${bars(r)}</div>
      <div class="why"><b>为什么是这家</b><p>${esc(r.reason)}</p></div>
      <div class="go">
        <b>怎么去</b>
        <div>${esc(r.metro)}</div>
        <div>${esc(r.reach)}</div>
      </div>
      <div class="tip"><b>点菜小抄</b>${esc(r.tip)}</div>
    </div>
  </article>`;
}

function renderFilters(){
  $('#filters').innerHTML = FILTERS.map(f => {
    const n = items.filter(f.test).length;
    return `<button class="chip ${f.key === filter ? 'on' : ''}" data-f="${f.key}">${f.label}${n ? '' : ' ·0'}</button>`;
  }).join('');
  $('#filters').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f; renderFilters(); renderList();
  }));
}

function renderList(){
  const f = FILTERS.find(x => x.key === filter) || FILTERS[0];
  // 顺序只有两个来源：后台排的（items 本身就是 sort 升序）或筛选器显式要求的排序。
  // 以前这里写了 f.sort || 按距离，结果后台怎么调都不生效 —— 别再偷偷重排。
  const rows = items.filter(f.test).slice();
  if (f.sort) rows.sort(f.sort);
  $('#list').innerHTML = rows.length
    ? rows.map(cardHTML).join('')
    : '<div class="empty">这个条件下暂时没有店 —— 换个筛选试试。</div>';
  $('#list').querySelectorAll('.card').forEach(el => el.addEventListener('click', () => pick(el.dataset.id)));
}

function pick(id){
  picked = (picked === id) ? null : id;
  const item = items.find(x => x.id === picked);
  $('#list').querySelectorAll('.card').forEach(el => el.classList.toggle('sel', el.dataset.id === picked));
  const t = $('#pickTxt');
  if (item){ t.textContent = item.name; t.classList.remove('empty'); $('#goBtn').disabled = false; }
  else { t.textContent = '还没选'; t.classList.add('empty'); $('#goBtn').disabled = true; }
  if (item) haptic();
}
function haptic(){ if (navigator.vibrate) navigator.vibrate(8); }

/* ============================ 前台：拉数据 ============================ */
async function loadMenu(){
  try{
    const res = await fetch(`${API}/menu`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    items = await res.json();
  } catch(e){
    $('#countNote').textContent = '菜单没加载出来，刷新一下试试';
    console.error(e); return;
  }
  $('#countNote').textContent = items.length
    ? `共 ${items.length} 家`
    : '菜单还是空的';
  $('#foot').innerHTML = '口味按「清 / 辣 / 油」分三档，0–5 是主观体感。两个距离都是直线距离：家＝三花国际，公司＝黄龙体育中心。';
  renderFilters(); renderList();

  const to = new URLSearchParams(location.search).get('to');
  if (to) $('#hello').innerHTML = `${esc(to)}，今晚<em>吃什么</em>`;
}

/* ============================ 确认 + 发送 ============================ */
function openConfirm(){
  const item = items.find(x => x.id === picked);
  if (!item) return;
  $('#confirmText').value = `我选择${item.name}`;
  $('#confirmMask').classList.add('show');
  setTimeout(() => $('#confirmText').focus(), 260);
}

async function sendChoice(){
  const text = $('#confirmText').value.trim();
  if (!text){ toast('写一句再确认'); return; }
  const btn = $('#confirmSend');
  btn.disabled = true; btn.textContent = '确认中…';
  try{
    const res = await fetch(`${API}/choose`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, restaurant_id: picked })
    });
    if (!res.ok){
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || ('HTTP ' + res.status));
    }
    const data = await res.json();
    $('#confirmMask').classList.remove('show');
    $('#doneText').textContent = data.text;
    $('#done').classList.add('show');
  } catch(e){
    toast('没成功：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '确认';
  }
}

/* ============================ 后台 ============================ */
async function adminFetch(path, opts = {}){
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Date-Password': adminPw, ...(opts.headers || {}) }
  });
  if (res.status === 401){ throw new Error('密码不对'); }
  if (!res.ok){
    const d = await res.json().catch(() => ({}));
    throw new Error(d.detail || ('HTTP ' + res.status));
  }
  return res.status === 204 ? null : res.json();
}

async function openAdmin(){
  if (!adminPw){ $('#gateMask').classList.add('show'); setTimeout(() => $('#pwInput').focus(), 250); return; }
  try{ await adminFetch('/admin/check', { method: 'POST' }); }
  catch(e){ adminPw = ''; sessionStorage.removeItem('date_admin_pw'); $('#gateMask').classList.add('show'); return; }
  $('#admin').classList.add('show'); await loadAdmin();
}

async function loadAdmin(){
  try{
    adminItems = await adminFetch('/admin/items');
    document.getElementById('adminForm').style.display = 'none';
    renderAdminList();
  } catch(e){ toast(e.message); }
}

function renderAdminList(){
  const box = $('#adminList');
  box.innerHTML = adminItems.map((r, i) => `
    <div class="arow" data-id="${esc(r.id)}">
      <div class="idx">${i + 1}</div>
      <div class="info">
        <div class="n">${esc(r.name)}${r.hidden ? ' <span style="color:#B9A6A0;font-weight:600">（隐藏）</span>' : ''}</div>
        <div class="m">${esc(r.cuisine)} · ¥${r.price} · 家 ${r.dist_km.toFixed(1)} / 司 ${r.dist_work_km.toFixed(1)} km</div>
      </div>
      <div class="ops">
        <button class="icon-btn" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="icon-btn" data-act="down" ${i === adminItems.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="icon-btn" data-act="edit">✎</button>
        <button class="icon-btn del" data-act="del">✕</button>
      </div>
    </div>`).join('') || '<div class="empty">还没有条目，点右上角「＋ 新增」。</div>';

  box.querySelectorAll('.arow').forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll('.icon-btn').forEach(btn => btn.addEventListener('click', async () => {
      const act = btn.dataset.act;
      if (act === 'edit'){ editing = adminItems.find(x => x.id === id); renderForm(editing); return; }
      if (act === 'del'){
        if (!confirm('删掉「' + (adminItems.find(x => x.id === id) || {}).name + '」？')) return;
        try{ await adminFetch('/items/' + id, { method: 'DELETE' }); await loadAdmin(); await loadMenu(); toast('删掉了'); }
        catch(e){ toast(e.message); }
        return;
      }
      const idx = adminItems.findIndex(x => x.id === id);
      const to = act === 'up' ? idx - 1 : idx + 1;
      if (to < 0 || to >= adminItems.length) return;
      const arr = adminItems.slice();
      [arr[idx], arr[to]] = [arr[to], arr[idx]];
      try{
        await adminFetch('/reorder', { method: 'POST', body: JSON.stringify({ ids: arr.map(x => x.id) }) });
        await loadAdmin(); await loadMenu();
      } catch(e){ toast(e.message); }
    }));
  });
}

async function saveForm(id){
  const val = (s) => document.getElementById(s).value.trim();
  const num = (s) => Number(document.getElementById(s).value || 0);
  const body = {
    name: val('f_name'), branch: val('f_branch'), cuisine: val('f_cuisine'),
    price: num('f_price'), score: num('f_score'), dist_km: num('f_dist'), dist_work_km: num('f_distw'),
    taste_light: num('f_light'), taste_spicy: num('f_spicy'), taste_oil: num('f_oil'),
    taste_label: val('f_tlabel') || '清淡', taste_kind: document.getElementById('f_tkind').value,
    reason: val('f_reason'), metro: val('f_metro'), reach: val('f_reach'), tip: val('f_tip'),
    art: document.getElementById('f_art').value,
    accent_a: (editing && editing.accent_a) || '#FDF1E7',
    accent_b: (editing && editing.accent_b) || '#F8E2D2',
    photo: val('f_photo') || null,
    hidden: document.getElementById('f_hidden').value === '1'
  };
  if (!body.name){ toast('店名不能空'); return; }
  try{
    if (id) await adminFetch('/items/' + id, { method: 'PATCH', body: JSON.stringify(body) });
    else    await adminFetch('/items', { method: 'POST', body: JSON.stringify(body) });
    toast('保存好了');
    await loadAdmin(); await loadMenu();
  } catch(e){ toast(e.message); }
}

$('#list').addEventListener('click', () => {});          // 占位：卡片各自绑了
$('#goBtn').addEventListener('click', openConfirm);
$('#confirmCancel').addEventListener('click', () => $('#confirmMask').classList.remove('show'));
$('#confirmSend').addEventListener('click', sendChoice);
$('#doneClose').addEventListener('click', () => { $('#done').classList.remove('show'); picked = null; pick(null); });
$('#doneBack').addEventListener('click', () => {
  $('#done').classList.remove('show'); picked = null; pick(null);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$('#gear').addEventListener('click', openAdmin);
$('#gateCancel').addEventListener('click', () => $('#gateMask').classList.remove('show'));
$('#gateGo').addEventListener('click', async () => {
  const pw = $('#pwInput').value.trim();
  adminPw = pw;
  try{
    await adminFetch('/admin/check', { method: 'POST' });
    sessionStorage.setItem('date_admin_pw', pw);
    $('#gateMask').classList.remove('show');
    $('#pwInput').value = '';
    $('#admin').classList.add('show');
    await loadAdmin();
  } catch(e){
    adminPw = ''; sessionStorage.removeItem('date_admin_pw');
    toast(e.message === '密码不对' ? '密码不对' : e.message);
  }
});
$('#adminClose').addEventListener('click', () => { $('#admin').classList.remove('show'); loadMenu(); });
$('#addBtn').addEventListener('click', () => { editing = null; renderForm(null); });
$('#pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#gateGo').click(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ document.querySelectorAll('.sheet-mask.show').forEach(m => m.classList.remove('show')); } });

loadMenu();
</script>
</body>
</html>
