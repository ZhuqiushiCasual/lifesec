<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>selfsec</title>
  <meta name="theme-color" content="#FBFBF8">
  <meta name="description" content="一个只有聊天窗口的个人秘书。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='7' y='7' width='18' height='18' rx='4' fill='%23171917'/><circle cx='16' cy='16' r='3' fill='%23FBFBF8'/></svg>">
  <!-- ?v= 用来把浏览器里可能还"新鲜"的旧缓存整条绕开：
       每次改前端就把版本号 +1（服务端另有 no-cache 兜底，这是双保险） -->
  <link rel="stylesheet" href="/styles.css?v=23">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="dot"></span>
        <b>selfsec</b>
      </div>
      <div class="meta">
        <button id="profile-init" class="badge" hidden>建立画像</button>
        <button id="open-recall" class="badge">回看</button>
        <button id="open-plan" class="badge">安排</button>
        <button id="plans-badge" class="badge" hidden></button>
        <span id="today" class="today"></span>
      </div>
    </header>

    <main id="stream" class="stream" aria-live="polite"></main>

    <footer class="composer">
      <textarea id="input" rows="1" maxlength="2000" placeholder="说点什么，它会记得…"></textarea>
      <button id="send" disabled>发送</button>
    </footer>
  </div>

  <!-- 回看：全屏视图，不占常驻底栏。时间轴是一条线路，经历是站点。 -->
  <section id="recall-view" class="page-view" hidden>
    <header class="page-head">
      <div class="page-title">
        <h1>回看</h1>
        <p id="recall-sub">你的生活，一条线走下来</p>
      </div>
      <button id="recall-close" class="page-close">关闭</button>
    </header>
    <div class="search-row">
      <input id="recall-search" class="search-input" type="search" enterkeyhint="search" autocomplete="off" placeholder="搜事件、地点、动作、计划">
    </div>
    <div class="page-filters" id="recall-filters">
      <button data-rf="all" class="chip on">全部</button>
      <button data-rf="record" class="chip">事件</button>
      <button data-rf="insight" class="chip">洞察</button>
      <button data-rf="place" class="chip">地点</button>
    </div>
    <div class="page-body" id="recall-body">
      <div class="page-empty">加载中…</div>
    </div>
  </section>

  <!-- 安排：全屏视图。逾期 / 今天 / 本周 / 更远 / 未定。 -->
  <section id="plan-view" class="page-view" hidden>
    <header class="page-head">
      <div class="page-title">
        <h1>安排</h1>
        <p>接下来的 14 天</p>
      </div>
      <button id="plan-close" class="page-close">关闭</button>
    </header>
    <div class="page-body" id="plan-body">
      <div class="page-empty">加载中…</div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <!-- 经历详情：点回看里的站点，先看当时的原话，再看结构化字段 -->
  <div id="experience" class="sheet" hidden>
    <div class="sheet-panel">
      <div class="sheet-head">
        <span id="exp-kicker" class="modal-kicker">生活记录</span>
        <button id="exp-close" class="drawer-close">关闭</button>
      </div>
      <div class="sheet-body" id="exp-body"></div>
    </div>
  </div>

  <!-- 安排候选：选日期 -->
  <div id="schedule" class="sheet" hidden>
    <div class="sheet-panel">
      <div class="sheet-head">
        <span class="modal-kicker">安排</span>
        <button id="schedule-close" class="drawer-close">关闭</button>
      </div>
      <div class="sheet-body">
        <h2 class="exp-title" id="schedule-title">安排到哪天？</h2>
        <div class="schedule-quick" id="schedule-quick">
          <button class="chip" data-day-offset="0">今天</button>
          <button class="chip" data-day-offset="1">明天</button>
          <button class="chip" data-day-offset="6">下周六</button>
          <button class="chip" data-day-offset="7">下周日</button>
        </div>
        <input type="date" id="schedule-date" class="schedule-date">
        <button id="schedule-confirm" class="ob-primary schedule-confirm">确认安排</button>
      </div>
    </div>
  </div>

  <!-- 洞察详情：卡面只放总结，点开看完整正文，再出去看原文 -->
  <div id="insight-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <span class="modal-kicker">外部消息</span>
        <button id="insight-close" class="drawer-close">关闭</button>
      </div>
      <div class="modal-body" id="insight-body">
        <div id="insight-meta" class="insight-modal-meta"></div>
        <h2 id="insight-title" class="insight-modal-title"></h2>
        <div class="insight-section-label">总结</div>
        <p id="insight-summary" class="insight-modal-summary"></p>
        <div id="insight-tags"></div>
        <div id="insight-detail-wrap">
          <div class="insight-section-label">详情</div>
          <div id="insight-detail" class="insight-detail"></div>
        </div>
      </div>
      <div class="modal-foot">
        <a id="insight-link" class="insight-open" target="_blank" rel="noreferrer">原文链接 ↗</a>
      </div>
    </div>
  </div>

  <!-- 画像初始化：10 题 → 可审阅预览 → 确认。建过之后入口按钮就消失 -->
  <div id="onboard" class="drawer" hidden>
    <div class="drawer-panel">
      <div class="drawer-head">
        <div class="ob-head">
          <b>先说清你是谁</b>
          <span id="ob-sub">10 个问题，答完它就一直记得</span>
        </div>
        <button id="ob-close" class="drawer-close">关闭</button>
      </div>
      <div class="drawer-body" id="ob-body"></div>
      <div class="ob-foot">
        <span class="ob-progress" id="ob-progress"></span>
        <div class="ob-actions">
          <button id="ob-back" class="ob-ghost" hidden>返回修改</button>
          <button id="ob-next" class="ob-primary" disabled>看看它理解的你</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js?v=23"></script>
</body>
</html>
