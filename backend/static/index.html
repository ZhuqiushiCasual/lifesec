<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>selfsec</title>
  <meta name="theme-color" content="#FBF7F1">
  <meta name="description" content="一个只有聊天窗口的个人秘书。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌿</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="dot"></span>
        <b>selfsec</b>
      </div>
      <div class="meta">
        <button id="open-history" class="badge">全部</button>
        <button id="plans-badge" class="badge" hidden></button>
        <span id="today" class="today"></span>
      </div>
    </header>

    <main id="stream" class="stream" aria-live="polite"></main>

    <footer class="composer">
      <textarea id="input" rows="1" maxlength="2000" placeholder="说点什么，它会记得…"></textarea>
      <button id="send" disabled>发送</button>
    </footer>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- 回溯：只读的历史，弹层即可，不占一个页面 -->
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-panel">
      <div class="drawer-head">
        <div class="drawer-tabs" id="drawer-tabs">
          <button data-f="all" class="on">全部</button>
          <button data-f="record">记录</button>
          <button data-f="insight">洞察</button>
        </div>
        <button id="drawer-close" class="drawer-close">关闭</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
      <button id="drawer-more" class="drawer-more" hidden>加载更早</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
