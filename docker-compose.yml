# 一键部署：docker compose up -d --build
#
# 两个容器：mysql + api。表结构与锚点用户由 api 启动时自动创建，
# 因此不再需要 docker-init 初始化 SQL。
services:
  mysql:
    image: mysql:8.0
    container_name: selfsec-mysql
    restart: unless-stopped
    environment:
      # 个人部署默认值，介意可在同目录放 .env 用 ${VAR} 覆盖
      MYSQL_ROOT_PASSWORD: selfsec-root-2026
      MYSQL_DATABASE: selfsec
      MYSQL_USER: selfsec
      MYSQL_PASSWORD: selfsec-2026
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    # 3306 不对宿主机暴露，仅容器网络内可访问

  api:
    build: ./backend
    container_name: selfsec-api
    restart: unless-stopped
    env_file:
      - backend/.env          # OPENAI_API_KEY / API_TOKEN 等；DATABASE_URL 由下面覆盖
    environment:
      DATABASE_URL: mysql+asyncmy://selfsec:selfsec-2026@mysql:3306/selfsec?charset=utf8mb4
      TZ: Asia/Shanghai
      DEBUG: "0"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
